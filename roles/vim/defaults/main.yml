---
vim_src_dir: "{{ role_path }}/files/"
vim_init_dest_dir: "{{ ansible_env.HOME }}/.config/nvim/"
vim_lua_dest_dir: "{{ ansible_env.HOME }}/.config/nvim/lua/"

vim_config_files:
  - init.lua

vim_lua_files:
  - base.lua
  - autocmds.lua
  - lazy_nvim.lua
  - plugins.lua
  - options.lua
  - keymaps.lua
  - lsp_config.lua
  - lsp_diagnostics.lua
