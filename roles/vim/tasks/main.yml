---
- name: Create config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.config/nvim"
    - "{{ ansible_env.HOME }}/.config/nvim/lua"

- name: Install neovim from pip3
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: "/opt/homebrew/bin/pip3"
    extra_args: "--break-system-packages"
    state: present
  loop:
    - neovim

- name: Install neovim from yarn
  community.general.yarn:
    name: "{{ item }}"
    executable: "/opt/homebrew/bin/yarn"
    global: true
    state: present
  loop:
    - neovim
  failed_when: false

# 配布リストから削除されたファイルのリンクを回収するため、
# リンク先が存在しないシンボリックリンクを検出して削除する
- name: Find symbolic links in config directories
  ansible.builtin.find:
    paths:
      - "{{ vim_init_dest_dir }}"
      - "{{ vim_lua_dest_dir }}"
    file_type: link
    recurse: false
  register: vim_config_links

- name: Check symbolic link targets
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
  loop: "{{ vim_config_links.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: vim_link_stats

- name: Remove dangling symbolic links
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ vim_link_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not item.stat.exists

- name: Symbolic link config files
  ansible.builtin.file:
    src: "{{ vim_src_dir }}{{ item }}"
    dest: "{{ vim_init_dest_dir }}{{ item }}"
    state: link
    force: true
  loop: "{{ vim_config_files }}"

- name: Symbolic link lua files
  ansible.builtin.file:
    src: "{{ vim_src_dir }}{{ item }}"
    dest: "{{ vim_lua_dest_dir }}{{ item }}"
    state: link
    force: true
  loop: "{{ vim_lua_files }}"
