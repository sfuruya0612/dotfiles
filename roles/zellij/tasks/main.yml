---
- name: Create ~/.config directories
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/zellij"
    state: directory
    mode: "0755"

- name: Symbolic link config file
  ansible.builtin.file:
    src: "{{ role_path }}/files/config.kdl"
    dest: "{{ ansible_env.HOME }}/.config/zellij/config.kdl"
    state: link
    force: true
